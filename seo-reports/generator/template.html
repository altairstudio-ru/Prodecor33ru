<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>{{TITLE}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F3EF;
      color: #1F1F1F;
      line-height: 1.6;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
    .report-header {
      background: #1F1F1F;
      color: #fff;
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 32px;
    }
    .report-header h1 { font-size: 28px; margin-bottom: 8px; }
    .report-header .period { color: #C6A96B; font-size: 15px; }
    .report-header .badge {
      display: inline-block;
      background: #C6A96B;
      color: #1F1F1F;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .section { margin-bottom: 32px; }
    .section h2 {
      font-size: 20px;
      color: #1F1F1F;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #C6A96B;
    }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; font-size: 14px; }
    th { background: #1F1F1F; color: #fff; font-weight: 600; }
    tr:nth-child(even) { background: #F9F8F6; }
    .status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .status.done { background: #e8f5e9; color: #2e7d32; }
    .status.wip { background: #fff3e0; color: #ef6c00; }
    .status.todo { background: #eceff1; color: #455a64; }
    .status.blocked { background: #fbe9e7; color: #c62828; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .metric {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e6e6e6;
    }
    .metric .value { font-size: 36px; font-weight: 700; color: #1F1F1F; }
    .metric .label { font-size: 13px; color: #8A8A8A; margin-top: 4px; }
    .metric .bar {
      height: 6px; background: #e6e6e6; border-radius: 3px; margin-top: 12px; overflow: hidden;
    }
    .metric .bar > div { height: 100%; background: #C6A96B; border-radius: 3px; }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 14px; }
    .report-footer {
      text-align: center;
      color: #8A8A8A;
      font-size: 12px;
      padding: 24px 0;
      border-top: 1px solid #e6e6e6;
      margin-top: 32px;
    }
    @media (max-width: 640px) {
      .report-header { padding: 24px; }
      .report-header h1 { font-size: 22px; }
      table { font-size: 12px; }
      th, td { padding: 8px 10px; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="report-header">
      <h1>{{TITLE}}</h1>
      <div class="period">{{PERIOD}}</div>
      <div><span class="badge">{{BADGE}}</span></div>
    </div>

    {{SECTIONS}}

    <div class="report-footer">
      проДЕКОР — SEO-отчёт · Сгенерировано {{GENERATED}} · Внутренний документ
    </div>
  </div>
</body>
</html>
